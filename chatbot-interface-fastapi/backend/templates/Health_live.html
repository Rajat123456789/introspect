<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Live Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .visualization-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .visualization-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .visualization-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .visualization-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .visualization-title {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            font-weight: 500;
        }
        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-button {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: var(--border-radius-sm);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .back-button:hover {
            background-color: var(--primary-dark);
            text-decoration: none;
        }
        [data-theme="dark"] {
            background-color: #212529;
        }
        [data-theme="dark"] .visualization-card {
            background-color: #343a40;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Health Live Data Visualizations</h1>
        <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> Back to Chat</a>
    </div>
    
    <div class="visualization-grid">
        <div class="visualization-card">
            <img src="/static/data/Health_live/combined_dashboard.png" alt="Combined Dashboard" class="visualization-image">
            <div class="visualization-title">Combined Dashboard</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/fitness_progress.png" alt="Fitness Progress" class="visualization-image">
            <div class="visualization-title">Fitness Progress</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/correlation_matrix.png" alt="Correlation Matrix" class="visualization-image">
            <div class="visualization-title">Correlation Matrix</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/advanced_insights.png" alt="Advanced Insights" class="visualization-image">
            <div class="visualization-title">Advanced Insights</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/advanced_insights_1.png" alt="Advanced Insights (Additional)" class="visualization-image">
            <div class="visualization-title">Advanced Insights (Additional)</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/activity_insights.png" alt="Activity Insights" class="visualization-image">
            <div class="visualization-title">Activity Insights</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/heart_rate_insights.png" alt="Heart Rate Insights" class="visualization-image">
            <div class="visualization-title">Heart Rate Insights</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/cardiovascular_analysis.png" alt="Cardiovascular Analysis" class="visualization-image">
            <div class="visualization-title">Cardiovascular Analysis</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/nutrition_analysis.png" alt="Nutrition Analysis" class="visualization-image">
            <div class="visualization-title">Nutrition Analysis</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/body_composition_analysis.png" alt="Body Composition Analysis" class="visualization-image">
            <div class="visualization-title">Body Composition Analysis</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/activity_analysis.png" alt="Activity Analysis" class="visualization-image">
            <div class="visualization-title">Activity Analysis</div>
        </div>
        
        <div class="visualization-card">
            <img src="/static/data/Health_live/sleep_analysis.png" alt="Sleep Analysis" class="visualization-image">
            <div class="visualization-title">Sleep Analysis</div>
        </div>
    </div>
    
    <script>
        // Check for saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
